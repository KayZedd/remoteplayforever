name: Bug report
description: Something does not work, crashes or broke after a Steam update
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead. Error messages verbatim.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Name and where it is from (Steam / GOG / emulator / ...).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RemotePlayForever version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: steam
    attributes:
      label: Steam client version
      description: Steam -> Help -> About Steam. Matters a lot after Steam updates.
      placeholder: "Built: Oct 30 2026, at 18:12:04"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: launch.log
      description: |
        Paste the end of `%LOCALAPPDATA%\RemotePlayForever\launch.log` (Settings tab -> Open log folder).
        Remove anything you consider private first.
      render: text
    validations:
      required: true
