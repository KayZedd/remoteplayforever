[package]
name = "remoteplayforever"
version = "0.1.1"
edition = "2024"
description = "Steam Remote Play Together for any game, Steam or not"
license = "MIT"
repository = "https://github.com/KayZedd/remoteplayforever"
readme = "README.md"
keywords = ["steam", "remote-play", "remote-play-together", "gaming"]
categories = ["games"]

[dependencies]
crc32fast = "1"
libloading = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
rfd = "0.18"
colored = "2"
anyhow = "1"
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_Globalization",
] }
eframe = "0.36"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
