<!doctype html>
<!-- Source of docs/img/social-preview.png (1280x640). Regenerate with docs/make-social-preview.sh -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(46, 160, 67, .22), transparent 60%),
      radial-gradient(700px 500px at 0% 100%, rgba(26, 115, 232, .20), transparent 60%),
      #0b0e14;
    color: #e6edf3;
    font-family: Inter, sans-serif;
    position: relative;
  }
  .left { position: absolute; left: 72px; top: 92px; width: 540px; }
  .tag {
    display: inline-block; font: 600 15px Inter; letter-spacing: .08em; text-transform: uppercase;
    color: #3fb950; border: 1px solid rgba(63, 185, 80, .45); border-radius: 999px; padding: 6px 14px;
  }
  h1 { font: 700 64px/1.02 "Space Grotesk", sans-serif; margin: 26px 0 18px; letter-spacing: -.02em; }
  p.lead { font: 400 26px/1.4 Inter; color: #aab4c0; margin: 0 0 34px; }
  p.lead b { color: #e6edf3; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips span {
    font: 600 17px Inter; padding: 9px 15px; border-radius: 10px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .10); color: #cdd6df;
  }
  .shot {
    position: absolute; right: 36px; top: 84px; width: 560px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    transform: perspective(1400px) rotateY(-9deg);
  }
  .shot img { display: block; width: 100%; }
  .url { position: absolute; left: 72px; bottom: 48px; font: 400 18px Inter; color: #6e7781; }
</style>
</head>
<body>
  <div class="left">
    <span class="tag">Open source · Windows</span>
    <h1>RemotePlay<br>Forever</h1>
    <p class="lead">Steam Remote Play Together for <b>any game</b>. Friends join with just a link.</p>
    <div class="chips">
      <span>Emulators</span><span>GOG</span><span>Epic</span><span>Non-Steam</span><span>Steam games without RPT</span>
    </div>
  </div>
  <div class="shot"><img src="img/launch.png" alt=""></div>
  <div class="url">github.com/KayZedd/remoteplayforever</div>
</body>
</html>
